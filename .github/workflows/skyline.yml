name: skyline

on:
  schedule:
    - cron: "17 3 * * *" # every night
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Draw skyline
        env:
          # Add a classic PAT with the read:user scope as the SKYLINE_TOKEN secret
          # to include private contributions. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
        # Pinned to a release tag on purpose: this step runs third-party code.
        run: go run github.com/pinkpixel-dev/skyline@v1.0.0 -theme neon -svg skyline.svg "${{ github.repository_owner }}"

      - name: Publish to output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv skyline.svg out/ && cd out
          git init -q -b output
          git add skyline.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update skyline"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
